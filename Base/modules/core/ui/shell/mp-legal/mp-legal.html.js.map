export default "<fxs-frame\r\n\tid=\"screen-legal\"\r\n\tclass=\"m-20\"\r\n>\r\n\t<fxs-vslot\r\n\t\tclass=\"main-content\"\r\n\t\tid=\"focus-root\"\r\n\t>\r\n\t\t<fxs-scrollable\r\n\t\t\tclass=\"mp-legal__scrollable pr-3\"\r\n\t\t\thandle-gamepad-pan=\"true\"\r\n\t\t>\r\n\t\t\t<div class=\"mp-legal__title font-title text-secondary text-xl self-center mb-4\"></div>\r\n\t\t\t<div class=\"mp-legal__content font-body text-white text-lg\"></div>\r\n\t\t</fxs-scrollable>\r\n\t</fxs-vslot>\r\n\r\n\t<fxs-vslot class=\"mp-legal-button-container relative flex flex-col\">\r\n\t\t<div\r\n\t\t\tclass=\"mp-legal-privacy-notice-instructions hidden mb-3 font-body text-base text-secondary self-center\"\r\n\t\t\tdata-l10n-id=\"LOC_UI_LEGAL_PRIVACY_NOTICE\"\r\n\t\t></div>\r\n\t\t<fxs-hslot class=\"mp-legal-button-container-inner self-center\">\r\n\t\t\t<fxs-button\r\n\t\t\t\tclass=\"button-cancel mr-6\"\r\n\t\t\t\tcaption=\"LOC_GENERIC_BACK\"\r\n\t\t\t\tdata-bind-class-toggle=\"mp-legal__hidden:{{g_NavTray.isTrayRequired}}\"\r\n\t\t\t></fxs-button>\r\n\t\t\t<fxs-button\r\n\t\t\t\tclass=\"button-accept mr-6\"\r\n\t\t\t\tcaption=\"LOC_TUTORIAL_NEXT_PAGE\"\r\n\t\t\t\tdata-bind-class-toggle=\"mp-legal__hidden:{{g_NavTray.isTrayRequired}}\"\r\n\t\t\t></fxs-button>\r\n\t\t\t<fxs-button\r\n\t\t\t\tclass=\"button-previous mr-6\"\r\n\t\t\t\tcaption=\"LOC_NAV_PREVIOUS\"\r\n\t\t\t\tdata-bind-class-toggle=\"mp-legal__hidden:{{g_NavTray.isTrayRequired}}\"\r\n\t\t\t></fxs-button>\r\n\t\t\t<fxs-button\r\n\t\t\t\tclass=\"button-next mr-6\"\r\n\t\t\t\tcaption=\"LOC_NAV_NEXT\"\r\n\t\t\t\tdata-bind-class-toggle=\"mp-legal__hidden:{{g_NavTray.isTrayRequired}}\"\r\n\t\t\t></fxs-button>\r\n\t\t</fxs-hslot>\r\n\t</fxs-vslot>\r\n</fxs-frame>\r\n"
